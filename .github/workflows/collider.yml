name: Collider

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 같은 PR 에 push 가 연달아 오면 앞선 실행을 접는다.
# 샌드박스와 GPU 추론이 겹쳐 돌면 크레딧만 쓴다.
concurrency:
  group: collider-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collider:
    name: future collision check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Collider 소스는 다른 저장소에 있다. 이 저장소는 검사 대상일 뿐이라
      # 체크아웃할 필요가 없다. Daytona 가 샌드박스 안에서 직접 clone 한다.
      - uses: actions/checkout@v4
        with:
          repository: currenjin/daytona-hack-sprint
          path: collider

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: collider

      - name: Run Collider
        working-directory: collider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          NOSANA_API_KEY: ${{ secrets.NOSANA_API_KEY }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          npm run collider -- \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number }}
